[theme]
builtin = "Nord"
community_palette = "Oxocarbon"
custom_palette = ""
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "qt", "kcolorscheme", "niri", "btop" ]
    community_ids = [ "zed", "yazi", "vicinae", "steam" ]
    enable_builtin_templates = true
    enable_community_templates = true

[wallpaper]
