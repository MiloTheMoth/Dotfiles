[audio]
enable_overdrive = false
enable_sounds = true
notification_sound = ""
sound_volume = 0.5
volume_change_sound = ""

[backdrop]
blur_intensity = 0.5
enabled = false
tint_intensity = 0.30000001192092896

[bar]
order = [ "default" ]

    [bar.default]
    auto_hide = false
    background_opacity = 0.89999997615814209
    border = "outline"
    border_width = 0.0
    capsule = false
    capsule_fill = "surface_variant"
    capsule_groups = []
    capsule_opacity = 1.0
    capsule_padding = 6.0
    center = [ "active_window" ]
    color = "primary"
    contact_shadow = false
    enabled = true
    end = [ "notifications", "network", "temp", "cpu", "ram", "battery", "tray", "session" ]
    font_weight = 500
    margin_edge = 8
    margin_ends = 140
    padding = 2
    position = "top"
    radius = 16
    radius_bottom_left = 16
    radius_bottom_right = 16
    radius_top_left = 16
    radius_top_right = 16
    reserve_space = true
    scale = 1.0
    shadow = true
    start = [ "control-center", "clock", "workspaces" ]
    thickness = 30
    widget_spacing = 6

[brightness]
enable_ddcutil = false
ignore_mmids = []

[control_center]
compact = true

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "mic_mute"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "clipboard"

    [[control_center.shortcuts]]
    type = "power_profile"

[desktop_widgets]
enabled = true
schema_version = 1
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    cx = 959.99993896484375
    cy = 1080.0
    enabled = true
    output = "eDP-1"
    rotation = 0.0
    scale = 5.8345990180969238
    type = "audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        aspect_ratio = 4.7000002861022949
        background = false
        bands = 32
        high_color = "secondary"
        low_color = "secondary"
        show_when_idle = true

[dock]
active_monitor_only = false
active_opacity = 1.0
active_scale = 1.0
auto_hide = false
background_opacity = 0.89999997615814209
enabled = false
icon_size = 48
inactive_opacity = 0.85000002384185791
inactive_scale = 0.85000002384185791
item_spacing = 6
launcher_icon = "grid-dots"
launcher_position = "none"
margin_edge = 8
margin_ends = 0
monitors = []
padding = 8
pinned = []
position = "bottom"
radius = 16
radius_bottom_left = 16
radius_bottom_right = 16
radius_top_left = 16
radius_top_right = 16
reserve_space = false
shadow = true
show_dots = false
show_instance_count = true
show_running = true

[hooks]
battery_low_percent_threshold = 0
battery_state_changed = []
battery_under_threshold = []
bluetooth_disabled = []
bluetooth_enabled = []
colors_changed = []
logging_out = []
power_profile_changed = []
rebooting = []
session_locked = []
session_unlocked = []
shutting_down = []
started = []
