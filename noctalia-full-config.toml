wallpaper_changed = []
wifi_disabled = []
wifi_enabled = []

[idle]
behavior_order = [ "lock", "screen-off", "suspend" ]
pre_action_fade_seconds = 2.0

    [idle.behavior.lock]
    action = "lock"
    command = ""
    enabled = false
    lock_before_suspend = true
    resume_command = ""
    timeout = 600

    [idle.behavior.screen-off]
    action = "screen_off"
    command = ""
    enabled = false
    lock_before_suspend = true
    resume_command = ""
    timeout = 660

    [idle.behavior.suspend]
    action = "suspend"
    command = ""
    enabled = false
    lock_before_suspend = true
    resume_command = ""
    timeout = 900

[keybinds]
cancel = [ "Escape" ]
down = [ "Down" ]
left = [ "Left" ]
right = [ "Right" ]
up = [ "Up" ]
validate = [ "Return", "KP_Enter" ]

[nightlight]
