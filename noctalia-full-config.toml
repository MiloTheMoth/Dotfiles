transition_duration = 1500.0

    [wallpaper.automation]
    enabled = true
    interval_minutes = 60
    order = "random"
    recursive = true

[weather]
address = "Keighley, United Kingdom"
auto_locate = false
effects = true
enabled = true
refresh_minutes = 30
unit = "metric"

[widget.active_window]
icon_size = 14.0
max_length = 800.0
min_length = 80.0
title_scroll = "none"
